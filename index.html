<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日蛋糕</title>
<meta name="description" content="今日蛋糕菜單與即時剩餘數量">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e8;
    --ink: #2b2420;
    --muted: #8a7f74;
    --rule: #d9cfc1;
    --accent: #a4462f;
    --serif-en: "Cormorant Garamond", Georgia, serif;
    --serif-tc: "Noto Serif TC", "Songti TC", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1d1916;
      --ink: #efe7db;
      --muted: #9a8f83;
      --rule: #3a332d;
      --accent: #e08a6d;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1d1916;
    --ink: #efe7db;
    --muted: #9a8f83;
    --rule: #3a332d;
    --accent: #e08a6d;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif-tc);
    line-height: 1.6;
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 20px 96px;
  }

  header { text-align: center; margin-bottom: 56px; }
  .eyebrow {
    font-family: var(--serif-en);
    font-style: italic;
    font-size: 20px;
    color: var(--muted);
    margin: 0 0 8px;
  }
  h1 {
    font-weight: 600;
    font-size: clamp(34px, 8vw, 46px);
    letter-spacing: 0.3em;
    margin: 0 0 0 0.3em; /* offset trailing letter-spacing so it centres */
  }
  .ornament {
    display: block;
    width: 48px;
    height: 1px;
    background: var(--accent);
    margin: 24px auto 0;
  }

  section { margin-bottom: 48px; }
  .group-label {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--serif-en);
    font-size: 15px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .group-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
  }
  li + li { border-top: 1px dotted var(--rule); }
  li.has-detail { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  li.has-detail:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  @media (hover: hover) {
    li.has-detail:hover .name { color: var(--accent); }
  }
  .photo {
    flex: none;
    align-self: center;
    width: 72px;
    height: 72px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--rule);
  }
  .text { align-self: center; }
  .name { font-size: 18px; }
  .note { display: block; font-size: 13px; color: var(--muted); }
  .leader { flex: 1; }
  .qty {
    font-family: var(--serif-en);
    font-size: 22px;
    white-space: nowrap;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .qty small {
    font-family: var(--serif-tc);
    font-size: 13px;
    color: var(--muted);
    margin-left: 4px;
  }
  .tag {
    font-family: var(--serif-tc);
    font-size: 13px;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  li.last .tag, .detail-head.last .tag { color: var(--accent); }
  li.soldout .name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  li.soldout .tag, .detail-head.soldout .tag { color: var(--muted); }
  li.soldout .photo { filter: grayscale(1); opacity: 0.45; }
  li.unknown .tag, .detail-head.unknown .tag { color: var(--muted); }
  .tabs {
    display: flex; gap: 4px; margin: -28px 0 0; overflow-x: auto;
    border-bottom: 1px solid var(--rule); scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; font: inherit; font-size: 15px; letter-spacing: 0.08em;
    padding: 9px 18px; color: var(--muted); background: none; border: 0;
    border-radius: 10px 10px 0 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tab[aria-selected="true"] {
    color: var(--ink);
    background: color-mix(in srgb, var(--ink) 7%, var(--paper));
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (hover: hover) { .tab:hover { color: var(--ink); } }
  .hint {
    text-align: center; font-size: 13px; letter-spacing: 0.05em;
    color: color-mix(in srgb, var(--ink) 60%, var(--paper));
    margin: 16px 0 28px;
  }
  footer {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 64px;
  }
  footer p { margin: 4px 0; }
  .status { min-height: 1.6em; }

  .loading { text-align: center; color: var(--muted); padding: 48px 0; }

  body:has(dialog[open]) { overflow: hidden; }
  dialog {
    width: min(520px, calc(100% - 32px));
    max-height: calc(100dvh - 32px);
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    overflow: auto;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
  }
  dialog::backdrop { background: rgba(28, 22, 18, 0.6); }
  dialog[open] { animation: rise 0.22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
  .detail-photo {
    display: block;
    width: 100%;
    max-height: 62dvh;
    object-fit: cover;
    background: var(--rule);
  }
  .detail-body { padding: 24px 24px 28px; }
  .detail-head { display: flex; align-items: baseline; gap: 12px; }
  .detail-head h3 { font-size: 22px; font-weight: 600; margin: 0; flex: 1; }
  .detail-head .tag, .detail-head .qty { flex: none; }
  .detail-note { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .detail-desc { margin: 16px 0 0; line-height: 1.8; }
  .detail-desc:empty { display: none; }
  .close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    color: #2b2420;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <p class="eyebrow">Today's Cakes</p>
    <h1>今日蛋糕</h1>
    <span class="ornament" aria-hidden="true"></span>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="蛋糕分類"></nav>
  <p class="hint">點擊圖片可放大，並查看蛋糕介紹</p>
  <div id="menu" aria-live="polite"><p class="loading">載入中…</p></div>

  <dialog id="detail" aria-labelledby="detail-name">
    <button class="close" type="button" aria-label="關閉">×</button>
    <img class="detail-photo" id="detail-photo" alt="">
    <div class="detail-body">
      <div class="detail-head" id="detail-head"><h3 id="detail-name"></h3></div>
      <p class="detail-note" id="detail-note"></p>
      <p class="detail-desc" id="detail-desc"></p>
    </div>
  </dialog>

  <footer>
    <p class="status" id="status"></p>
    <p>數量每分鐘自動更新，實際以現場為準</p>
  </footer>
</main>

<script>
  const SHEET_ID = "1qXBVUzLcjmW4YT7j1vZSWf930VnqcWEnAZJYrZztEMA";
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
  const REFRESH_MS = 60 * 1000;
  // Optional tab in the same sheet: column A 蛋糕名稱, column B 介紹. Overrides DESCRIPTIONS below.
  const DESC_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("介紹")}`;

  const DESCRIPTIONS = {
    "紅絲絨": "經典紅絲絨蛋糕體，層層夾入白色奶霜，口感濕潤綿密。",
    "亮晶晴藍莓": "藍莓慕斯與蛋糕層層相疊，頂端點綴奶油花，酸甜清爽。",
    "瑞士頂級巧克力": "巧克力蛋糕與巧克力慕斯多層堆疊，濃郁而不膩口。",
    "檸檬香草起士": "檸檬的清新酸香搭配香草起士，滑順清爽。",
    "肉桂卷": "捲得紮實的肉桂卷，香氣溫暖，適合配一杯咖啡。",
    "生巧克力蛋糕": "濃密綿滑，宛如生巧克力般入口即化。",
    "紐約起士": "扎實濃郁的經典重乳酪蛋糕，奶香十足。",
    "法式蘋果塔": "酥脆塔皮盛裝蘋果內餡，果香與奶油香交織。",
    "肯亞伯爵茶波士頓": "帶著伯爵茶香的波士頓派，蛋糕體夾入綿密奶餡，茶香優雅。",
    "德國黑森林": "巧克力蛋糕、鮮奶油與櫻桃的經典組合，頂端飾以巧克力片。",
    "森半抹茶波士頓": "使用森半抹茶，抹茶蛋糕體夾入綿密奶餡，微苦回甘。",
    "古典巧克力": "口感濃厚紮實的古典巧克力蛋糕，可可香氣飽滿。",
    "綜合水果達克瓦茲(水果根據季節變動)": "外酥內軟的達克瓦茲夾入奶餡與新鮮水果，水果依季節變動。",
    "南洋開心果蛋糕": "開心果風味蛋糕，堅果香氣濃郁，色澤清新。",
    "水果起士(山茶花)": "滑順的起士蛋糕鋪上新鮮水果，酸甜平衡。",
    "水果塔": "酥脆塔皮填入奶餡，鋪滿繽紛新鮮水果。",
    "檸檬起司球": "圓潤可愛的起司球，帶著檸檬的清新酸香。",
    "桂花春茶": "桂花與春茶的淡雅香氣，口感輕盈。",
    "法式千層蛋糕": "薄餅與奶餡一層層堆疊，口感細緻柔軟。",
    "橘丁核桃布朗尼": "濃郁的巧克力布朗尼，加入橘丁與核桃，香氣與口感層次豐富。",
  };
  let sheetDescriptions = {};

  // Photos extracted from the sheet's 蛋糕圖片 column, keyed by cake name.
  const PHOTOS = {
    "紅絲絨": "red-velvet", "亮晶晴藍莓": "blueberry", "瑞士頂級巧克力": "swiss-chocolate",
    "檸檬香草起士": "lemon-vanilla-cheese", "肉桂卷": "cinnamon-roll", "生巧克力蛋糕": "nama-chocolate",
    "紐約起士": "new-york-cheese", "法式蘋果塔": "apple-tart", "肯亞伯爵茶波士頓": "earl-grey-boston",
    "德國黑森林": "black-forest", "森半抹茶波士頓": "matcha-boston", "古典巧克力": "classic-chocolate",
    "綜合水果達克瓦茲(水果根據季節變動)": "fruit-dacquoise", "南洋開心果蛋糕": "pistachio",
    "水果起士(山茶花)": "fruit-cheese", "水果塔": "fruit-tart", "檸檬起司球": "lemon-cheese-ball",
    "桂花春茶": "osmanthus-tea", "法式千層蛋糕": "mille-crepe", "橘丁核桃布朗尼": "orange-walnut-brownie",
  };

  // Snapshot shown when the sheet can't be reached (offline, blocked, etc.)
  const FALLBACK = [
    { label: "1-1", items: [["紅絲絨", "1"], ["亮晶晴藍莓", "2"], ["瑞士頂級巧克力", "3"], ["檸檬香草起士", "0"]] },
    { label: "1-2", items: [["肉桂卷", "1"], ["生巧克力蛋糕", "0"], ["紐約起士", "0"], ["法式蘋果塔", "0"]] },
    { label: "2", items: [["肉桂卷", "3"], ["肯亞伯爵茶波士頓", "0"], ["德國黑森林", "3"], ["森半抹茶波士頓", "3"], ["古典巧克力", "3"]] },
    { label: "3", items: [["綜合水果達克瓦茲(水果根據季節變動)", "4"], ["南洋開心果蛋糕", "0"], ["水果起士(山茶花)", "3"], ["水果塔", "0"]] },
    { label: "4", items: [["檸檬起司球", "0"], ["桂花春茶", "3"], ["法式千層蛋糕", ""], ["橘丁核桃布朗尼", ""]] },
  ];

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') quoted = false;
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // The sheet lays groups side by side, 4 columns each: label | 名稱 | 圖片 | 剩餘個數.
  function toGroups(rows) {
    const width = Math.max(0, ...rows.map(r => r.length));
    const groups = [];
    for (let c = 0; c + 1 < width; c += 4) {
      let label = "";
      const items = [];
      for (const r of rows) {
        const name = (r[c + 1] || "").trim();
        if (!label && (r[c] || "").trim()) label = r[c].trim();
        if (!name || name === "蛋糕名稱") continue;
                const pic = (r[c + 2] || "").trim();
        if (pic) PHOTOS[name] = pic;
        items.push([name, (r[c + 3] || "").trim()]);
      }
      if (items.length) groups.push({ label: label || String(groups.length + 1), items });
    }
    return groups;
  }
  function driveId(v) {
    if (!/drive\.google\.com|docs\.google\.com/.test(v)) return "";
    return (v.match(/\/d\/([\w-]+)/) || v.match(/[?&]id=([\w-]+)/) || [])[1] || "";
  }
  function thumbSrc(p) {
    if (/^https?:/i.test(p)) {
      const id = driveId(p);
      return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w300` : p;
    }
    if (/\.\w+$/.test(p)) return encodeURI(p);
    return `img/thumb/${p}.jpg`;
  }
  function fullSrc(p) {
    if (/^https?:/i.test(p)) {
      const id = driveId(p);
      return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1200` : p;
    }
    if (/\.\w+$/.test(p)) return encodeURI(p);
    return `img/${p}.jpg`;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderItem([rawName, rawQty]) {
    const li = el("li");
    // Split a trailing parenthetical note, e.g. "水果起士(山茶花)"
    const m = rawName.match(/^(.*?)\s*[（(](.+)[)）]\s*$/);
    const title = m ? m[1] : rawName;
    const photo = PHOTOS[rawName];
    if (photo) {
      const img = el("img", "photo");
      img.src = thumbSrc(photo);
      img.alt = title;
      img.loading = "lazy";
      img.width = img.height = 72;
      li.append(img);
    }
    const nameWrap = el("span", "text");
    nameWrap.append(el("span", "name", title));
    if (m) nameWrap.append(el("span", "note", m[2]));
    li.append(nameWrap, el("span", "leader"));

    const { state, nodes } = stockNodes(rawQty);
    if (state) li.classList.add(state);
    li.append(...nodes);

    if (photo || describe(rawName)) {
      li.classList.add("has-detail");
      li.tabIndex = 0;
      li.setAttribute("role", "button");
      li.setAttribute("aria-haspopup", "dialog");
      const open = () => openDetail(rawName, rawQty);
      li.addEventListener("click", open);
      li.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    }
    return li;
  }

  function stockNodes(rawQty) {
    const n = rawQty === "" ? NaN : Number(rawQty);
    if (Number.isNaN(n)) return { state: "unknown", nodes: [el("span", "tag", "請洽店員")] };
    if (n <= 0) return { state: "soldout", nodes: [el("span", "tag", "已售完")] };
    const q = el("span", "qty", String(n));
    q.append(el("small", null, "個"));
    return n === 1
      ? { state: "last", nodes: [el("span", "tag", "最後一個"), q] }
      : { state: "", nodes: [q] };
  }

  const describe = name => sheetDescriptions[name] || DESCRIPTIONS[name] || "";

  const dialog = document.getElementById("detail");
  function openDetail(rawName, rawQty) {
    const m = rawName.match(/^(.*?)\s*[（(](.+)[)）]\s*$/);
    const photo = PHOTOS[rawName];
    const img = document.getElementById("detail-photo");
    img.hidden = !photo;
    if (photo) { img.src = fullSrc(photo); img.alt = m ? m[1] : rawName; }
    document.getElementById("detail-name").textContent = m ? m[1] : rawName;
    document.getElementById("detail-note").textContent = m ? m[2] : "";
    document.getElementById("detail-desc").textContent = describe(rawName);
    const head = document.getElementById("detail-head");
    head.replaceChildren(head.firstElementChild);
    const { state, nodes } = stockNodes(rawQty);
    head.append(...nodes);
    head.className = "detail-head " + state;
    dialog.showModal();
  }
  dialog.querySelector(".close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

    // ── 分頁：要新增固定條件的分頁，就在這裡加一行 ──
  const BASE_TABS = [
    { id: "all", label: "全部", test: () => true },
    { id: "available", label: "供應中", test: ([, qty]) => stockNodes(qty).state !== "soldout" },
  ];
  // 分類預設值；Sheet「介紹」分頁 C 欄「分類」有填的話以 Sheet 為準
  const TAGS = {
    "瑞士頂級巧克力": ["巧克力系列"], "生巧克力蛋糕": ["巧克力系列"], "古典巧克力": ["巧克力系列"],
    "德國黑森林": ["巧克力系列"], "橘丁核桃布朗尼": ["巧克力系列"],
  };
  let sheetTags = {}, lastGroups = [], activeTab = "all";
  const tagsOf = name => (sheetTags[name] && sheetTags[name].length ? sheetTags[name] : TAGS[name]) || [];

  function buildTabs(groups) {
    const tags = [];
    for (const g of groups) for (const [name] of g.items)
      for (const t of tagsOf(name)) if (!tags.includes(t)) tags.push(t);
    return [...BASE_TABS, ...tags.map(t => ({ id: "tag:" + t, label: t, test: ([name]) => tagsOf(name).includes(t) }))];
  }

  function render(groups) {
    lastGroups = groups;
    const tabs = buildTabs(groups);
    if (!tabs.some(t => t.id === activeTab)) activeTab = "all";
    document.getElementById("tabs").replaceChildren(...tabs.map(t => {
      const b = el("button", "tab", t.label);
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(t.id === activeTab));
      b.addEventListener("click", () => { activeTab = t.id; render(lastGroups); });
      return b;
    }));
    const tab = tabs.find(t => t.id === activeTab);
    const sections = groups.map(g => {
      const items = g.items.filter(tab.test);
      if (!items.length) return null;
      const s = el("section");
      s.append(el("h2", "group-label", "No. " + g.label));
      const ul = el("ul");
      ul.append(...items.map(renderItem));
      s.append(ul);
      return s;
    }).filter(Boolean);
    document.getElementById("menu").replaceChildren(
      ...(sections.length ? sections : [el("p", "loading", "目前沒有符合的品項")]));
  }

  function setStatus(text) { document.getElementById("status").textContent = text; }
  const timeNow = () => new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });

  let hasLive = false;
  async function load() {
    try {
      const res = await fetch(SHEET_URL + "&_=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const groups = toGroups(parseCSV(await res.text()));
      if (!groups.length) throw new Error("empty");
      render(groups);
      hasLive = true;
      setStatus("更新於 " + timeNow());
    } catch (err) {
      if (!hasLive) {
        render(FALLBACK);
        setStatus("暫時無法連線，顯示的是先前的資料");
      }
    }
  }

  async function loadDescriptions() {
    try {
      const res = await fetch(DESC_URL, { cache: "no-store" });
      if (!res.ok) return;
      const rows = parseCSV(await res.text());
      // gviz silently returns the first tab when 介紹 doesn't exist; require its header.
      if (!rows.some(r => (r[0] || "").trim() === "蛋糕名稱" && (r[1] || "").trim() === "介紹")) return;
           const map = {}, tagMap = {};
      for (const [name = "", desc = "", tag = ""] of rows) {
        const n = name.trim();
        if (!n || n === "蛋糕名稱") continue;
        if (desc.trim()) map[n] = desc.trim();
        const t = tag.split(/[,，、;；]/).map(s => s.trim()).filter(Boolean);
        if (t.length) tagMap[n] = t;
      }
      sheetDescriptions = map;
      sheetTags = tagMap;
      if (lastGroups.length) render(lastGroups);
    } catch (err) {}
  }

  loadDescriptions();
  load();
  setInterval(load, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
